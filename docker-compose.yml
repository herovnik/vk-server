services:
  vk-turn-proxy:
    image: ghcr.io/mysorez/vk-turn-proxy:v1.5.3
    container_name: vk_turn
    restart: unless-stopped
    # ВАЖНО: штатный entrypoint образа игнорирует command и не умеет -wrap/-password.
    # Переопределяем — запускаем бинарник сервера напрямую:
    entrypoint: ["./vk-turn-proxy"]
    command:
      - "-listen"
      - "0.0.0.0:56000"
      - "-connect"
      - "wireguard:51820"
      - "-wrap"
      - "-password"
      - "lD3nYnYYgE0YYrqJF1E6W9Ss"
    ports:
      - "56000:56000/udp"

  wireguard:
    image: linuxserver/wireguard:1.0.20260223-r0-ls123
    container_name: vk_wg
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./wg0.conf:/config/wg0.conf:ro
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
